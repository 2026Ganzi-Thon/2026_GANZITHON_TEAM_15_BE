spring:
  application:
    name: teolhanol
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

app:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  llm:
    # auto: Upstage 키가 있으면 Upstage, 없으면 Claude. upstage / claude로 고정할 수도 있음
    provider: ${LLM_PROVIDER:auto}
    upstage:
      api-key: ${UPSTAGE_API_KEY:}
      base-url: ${UPSTAGE_BASE_URL:}
      model: ${UPSTAGE_MODEL:solar-pro4}
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:}
    model: ${LLM_MODEL:claude-opus-5-5}
    chat-timeout-seconds: 60
    max-retries: 2
    server-fallback: true
  # 나의 양 꾸미기 아이템 고정 데이터 (SHP-03). 필요 털실은 디자인 확정 전 임시 값
  sheep-items:
    items:
      - { code: SCARF, name: 목도리, yarn-cost: 3 }
      - { code: HAT, name: 모자, yarn-cost: 4 }
      - { code: BELL, name: 방울, yarn-cost: 2 }
      - { code: RIBBON, name: 리본, yarn-cost: 2 }
  # 기능명세서 5장 정책 수치 (시연 기준 초안, 2026-11-08 와이어프레임 v2 기준)
  policy:
    auth:
      max-login-failures: 5
      lock-minutes: 5
      nickname-min-length: 2
      nickname-max-length: 12
      password-min-length: 8
      reserved-nickname-words: [운영자, 관리자, 운영진, 털한올, admin, manager]
    diary:
      daily-limit: 3
    care:
      min-user-messages-for-wool: 3
      max-user-messages: 10
      ai-response-max-length: 300
    worry:
      max-length: 200
      daily-limit: 3
      wool-cap: 10
      auto-graduate-days: 7
      page-size: 20
      protected-view-min-sent-wools: 5
      auto-hide-report-count: 3
    wool:
      max-length: 100
    safety:
      crisis-banner-hours: 24
      llm-timeout-seconds: 5
