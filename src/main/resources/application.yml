spring:
  application:
    name: teolhanol
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

app:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  llm:
    # auto: Upstage 키가 있으면 Upstage, 없으면 Claude. upstage / claude로 고정할 수도 있음
    provider: ${LLM_PROVIDER:auto}
    upstage:
      api-key: ${UPSTAGE_API_KEY:}
      base-url: ${UPSTAGE_BASE_URL:}
      model: ${UPSTAGE_MODEL:solar-pro4}
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:}
    model: ${LLM_MODEL:claude-opus-5-5}
    chat-timeout-seconds: 60
    max-retries: 2
    server-fallback: true
  # 털 도착 알림 (WOL-02). VAPID 키가 비어 있으면 웹 푸시만 꺼지고 구독 저장과 앱 안 알림(SSE)은 동작합니다.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
    # 털 도착 알림을 눌렀을 때 열 프론트 경로 (FARM-05 내 고민 양 상세). {sheepId}를 양 id로 바꿉니다
    click-url-pattern: /farm/my/{sheepId}
    # 구독 endpoint로 받아 줄 푸시 서비스 호스트(하위 도메인 포함). 서버가 임의 주소로 요청하지 않게 막습니다
    allowed-hosts:
      - fcm.googleapis.com
      - push.services.mozilla.com
      - push.apple.com
      - notify.windows.com
    ttl-seconds: 86400
    send-timeout-seconds: 5
    sse-timeout-minutes: 30
    sse-heartbeat-seconds: 25
    sse-max-per-user: 5
  # 나의 양 꾸미기 아이템 고정 데이터 (SHP-03). 필요 털실은 와이어프레임 v3 ME-03 기준
  # (목도리는 화면에 값이 없어 임시 값)
  sheep-items:
    items:
      - { code: SCARF, name: 목도리, yarn-cost: 3 }
      - { code: HAT, name: 모자, yarn-cost: 5 }
      - { code: BELL, name: 방울, yarn-cost: 8 }
      - { code: RIBBON, name: 리본, yarn-cost: 3 }
  # 기능명세서 5장 정책 수치 (시연 기준 초안, 2026-11-08 와이어프레임 v2 기준)
  policy:
    auth:
      max-login-failures: 5
      lock-minutes: 5
      nickname-min-length: 2
      nickname-max-length: 10
      password-min-length: 8
      reserved-nickname-words: [운영자, 관리자, 운영진, 털한올, admin, manager]
    diary:
      daily-limit: 3
    care:
      min-user-messages-for-wool: 3
      max-user-messages: 10
      ai-response-max-length: 300
    worry:
      max-length: 200
      daily-limit: 3
      wool-cap: 10
      auto-graduate-days: 7
      auto-graduate-cron: "0 0 * * * *"
      page-size: 20
      protected-view-min-sent-wools: 5
      auto-hide-report-count: 3
    wool:
      max-length: 100
    safety:
      crisis-banner-hours: 24
      llm-timeout-seconds: 5
