# 운영: 모든 접속 정보는 환경변수로 주입합니다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 해커톤 일정상 마이그레이션 도구 없이 엔티티 기준으로 스키마를 맞춥니다. 안정화 후 validate로 바꾸세요.
      ddl-auto: ${JPA_DDL_AUTO:update}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  crypto:
    # 필수. 생성: openssl rand -base64 32
    key: ${APP_CRYPTO_KEY}
  jwt:
    # 필수. 생성: openssl rand -base64 48
    secret: ${APP_JWT_SECRET}
