# 로컬 개발: docker compose up -d 로 MySQL을 띄운 뒤 실행합니다.
spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:teolhanol}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:teolhanol}
    password: ${DB_PASSWORD:teolhanol}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

logging:
  level:
    com.ganzithon.teolhanol: debug
