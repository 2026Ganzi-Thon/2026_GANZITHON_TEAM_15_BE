# 테스트는 Docker 없이 돌도록 H2(MySQL 모드)를 사용합니다.
spring:
  datasource:
    url: jdbc:h2:mem:teolhanol;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  scheduling:
    enabled: false
  cors:
    allowed-origins: http://localhost:3000
  crypto:
    key: P4qetJl4vwR1gXmf/WHFEMuQM/huAanu+kFjgm6D0Yw=
  jwt:
    secret: test-only-jwt-secret-for-unit-tests-0123456789
