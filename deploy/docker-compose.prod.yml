# EC2에서 사용하는 운영용 compose 파일입니다. CD가 ~/teolhanol 로 복사합니다.
# 같은 폴더의 .env 에 운영 값을 넣어 두세요 (docs/DEPLOY.md 참고).
services:
  app:
    image: ghcr.io/2026ganzi-thon/teolhanol-be:${IMAGE_TAG:-latest}
    container_name: teolhanol-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/teolhanol?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    ports:
      - "80:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # 해커톤 규모에서는 같은 EC2에 MySQL을 함께 띄웁니다. RDS를 쓰면 .env 의 DB_URL 을 RDS 주소로 바꾸고 이 서비스는 지워도 됩니다.
  mysql:
    image: mysql:8.4
    container_name: teolhanol-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: teolhanol
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
